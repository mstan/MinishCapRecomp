# Reviewed recompile knowledge — HAND-OWNED, not importer output.
#
# The Legend of Zelda: The Minish Cap (USA)
#
# symbols/minishcap.toml is generated by tools/import_tmc_symbols and says
# so at the top ("Do not hand-edit; rerun the importer"), yet it is also the
# config the recompile is driven by. Anything reviewed that lands there is
# lost the next time the importer runs. This file is a CONFIG OVERLAY layered
# on top of it, and no tool writes it.
#
# Pass it as a second --config, after symbols/minishcap.toml. The base wins
# every conflict; see gbarecomp/docs/TOML_SCHEMA.md "Overlay configs".

# Must match the base config: these are exact addresses in one binary.
[identity]
sha1 = "b4bd50e4131b027c334547b4524e2dbbd4227130"

# CollideAll calls this local ARM helper from the IWRAM copy. The original
# symbol import exposes CollideAll but omits its private CalcCollision entry.
# Use its real copied address; the preceding three words are literal data,
# so this is an ordinary callee entry, not a blanket resume range.
[[extra_func]]
addr = 0x03005B0C
mode = "arm"
name = "ram_CalcCollision"
note = "Exact USA IWRAM copy of arm_CalcCollision at 0x080B1D98 (iwram_funcs code_copy)."

# Interrupt/frame presentation may resume the copied ARM renderer at any
# aligned instruction, not only its named entries. These contiguous draw
# helpers run from arm_DrawEntities to the next sub_080B299C entry in the
# exact USA ROM: 0x080B23F0..0x080B299C, copied to 0x03006164..0x03006710.
# All 363 ARM instructions were checked against the live IWRAM copy. The
# span contains no declared data or PC-relative literal pools; it excludes
# the unknown tail and tables at/after 0x080B299C. Cover the renderer class
# rather than chasing one resume PC each time interrupt timing changes.
[[resume_range]]
start = 0x03006164
end   = 0x03006710
mode  = "arm"

# Optional vertical presentation: exact USA draw/visibility instructions.
# The host callback declines these sites when no vertical extension is active.
[[thumb_alu_immediate_override]]
addr = 0x080040C8
note = "Adaptive view: CheckOnScreen top guard"
[[thumb_alu_immediate_override]]
addr = 0x080562E6
note = "Adaptive view: CheckRegionOnScreen bottom edge"
[[thumb_alu_immediate_override]]
addr = 0x080562EA
note = "Adaptive view: CheckRegionOnScreen total vertical span"
[[alu_immediate_override]]
addr = 0x080B28FC
note = "Adaptive view: ARM sprite-piece bottom clip"
[[alu_immediate_override]]
addr = 0x03006670
note = "Adaptive view: live copied ARM sprite-piece bottom clip"
