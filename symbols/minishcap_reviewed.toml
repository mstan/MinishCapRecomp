# Reviewed recompile knowledge — HAND-OWNED, not importer output.
#
# The Legend of Zelda: The Minish Cap (USA)
#
# symbols/minishcap.toml is generated by tools/import_tmc_symbols and says
# so at the top ("Do not hand-edit; rerun the importer"), yet it is also the
# config the recompile is driven by. Anything reviewed that lands there is
# lost the next time the importer runs. This file is a CONFIG OVERLAY layered
# on top of it, and no tool writes it.
#
# Pass it as a second --config, after symbols/minishcap.toml. The base wins
# every conflict; see gbarecomp/docs/TOML_SCHEMA.md "Overlay configs".

# Must match the base config: these are exact addresses in one binary.
[identity]
sha1 = "b4bd50e4131b027c334547b4524e2dbbd4227130"

# ── Interior resume points in the IWRAM-resident function block ─────
#
# 0x030062A0 lives inside the `iwram_funcs` [[code_copy]] (tmc RAMFUNCS_BASE,
# 0x030056F0 + 0x1280). Copied-to-RAM code that runs with interrupts live can
# be re-entered at any instruction boundary, not just at its entry: the
# runtime yields to present a frame and then re-dispatches R15 wherever it
# happened to be.
#
# On the engine as of 2026-08-21 that lands at 0x030062A8 — 8 bytes in —
# roughly 291 times over 900 frames, and without a resume alias there it
# dispatch-misses and gets bridged through the interpreter (~291k interpreted
# instructions). The older engine this game was pinned to happened to yield at
# a different instruction, so the miss only appeared when the pin moved
# forward. Nothing about the game changed.
#
# Declared as a [[resume_range]] rather than one [[extra_func]] resume = true
# per observed address, because chasing individual PCs only re-fixes this the
# next time frame pacing shifts by an instruction. The range covers the whole
# function (entry 0x030062A0 to the next entry 0x03006428, 0x188 bytes) so
# every aligned interior boundary in it is resumable. That is the narrow form
# the schema recommends: bounded to one reviewed function, well inside the
# 0x1000 cap, and inside a declared code_copy runtime span.
[[resume_range]]
start = 0x030062A0
end   = 0x03006428
mode  = "arm"

# DrawDirect's nonempty path follows its conditional BX LR at 0x030065A4.
# The copied ARM body is ROM 0x080B2828..0x080B2873, ending immediately
# before the next reviewed entry, 0x030065E8. It contains code throughout
# this span; retain its fall-through and frame-boundary continuation entries.
[[resume_range]]
start = 0x0300659C
end   = 0x030065E8
mode  = "arm"

# The sprite-list helper likewise has a nonempty path after its conditional
# BX LR at 0x03006438. ROM 0x080B26B4..0x080B2717 contains only ARM code,
# including the loop's ordinary return; the following helper starts at 648C.
[[resume_range]]
start = 0x03006428
end   = 0x0300648C
mode  = "arm"
